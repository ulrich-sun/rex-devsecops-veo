apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mon-chart.fullname" . }}-mysql
  labels:
    {{- include "mon-chart.labels" . | nindent 4 }}
    tier: bdd
spec:
  replicas: {{ .Values.mysql.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "mon-chart.name" . }}
      tier: bdd
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: {{ include "mon-chart.name" . }}
        tier: bdd
    spec:
      containers:
        - name: {{ .Values.mysql.containerName }}
          image: "{{ .Values.mysql.image.repository }}:{{ .Values.mysql.image.tag }}"
          imagePullPolicy: {{ .Values.mysql.image.pullPolicy }}
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mysql.secret.name }}
                  key: {{ .Values.mysql.secret.key }}
            - name: MYSQL_DATABASE
              value: {{ .Values.mysql.database.name | quote }}
            - name: MYSQL_USER
              value: {{ .Values.mysql.database.user | quote }}
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mysql.secret.name }}
                  key: {{ .Values.mysql.secret.key }}
          ports:
            - name: mysql-port
              containerPort: {{ .Values.mysql.port }}
          volumeMounts:
            - name: mysql-volume
              mountPath: {{ .Values.mysql.persistence.mountPath }}
      volumes:
        - name: mysql-volume
          persistentVolumeClaim:
            claimName: {{ .Values.mysql.persistence.claimName }}
